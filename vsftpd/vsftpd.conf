# Базовые настройки безопасности
listen=YES
listen_port=2121
anonymous_enable=NO
local_enable=YES
write_enable=YES

# КРИТИЧНО ДЛЯ TANZU (ROOTLESS):
run_as_launching_user=YES
isolate=NO

# Режим виртуальных пользователей
guest_enable=YES
guest_username=tanzuuser
pam_service_name=vsftpd.virtual
user_sub_token=$USER
local_root=/data

# Отключаем chroot, так как без root его сделать невозможно
chroot_local_user=NO
allow_writeable_chroot=NO
chown_uploads=NO

# Логи внутри контейнера
background=NO
seccomp_sandbox=NO
xferlog_enable=YES
log_ftp_protocol=YES

# Пассивный режим (PASV) для Kubernetes
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30005
