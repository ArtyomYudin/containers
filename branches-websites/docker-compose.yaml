  mariadb:
    image: hanna.center-inform.ru/bitnamilegacy/mariadb:12.0.2
#    user: "1001:1001"
#    ports:
#      - "3306:3306" # Уберите эту строку, если БД не должна быть доступна с хост-машины
    volumes:
      - mariadb-data:/bitnami/mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=sLZ8dWsoVQsI
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  r23-storage:
  r31-storage:
  r39-storage:
  r48-storage:
    # Если нужно сохранить данные при удалении volume, Docker делает это по умолчанию.
    # Для переноса данных из Kubernetes см. инструкцию ниже.
  mariadb-data: