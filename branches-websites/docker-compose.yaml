networks:
  default:
    external: true
    name: it_support

services:
  r23-nginx:
    image: hanna.center-inform.ru/bitnamilegacy/nginx:1.29.1
#    user: "1001:1001" # Bitnami требует запуска от этого пользователя
    ports:
      - "8023:8080" # Хост:Контейнер. Можно изменить на "80:8080", если порт 8080 не нужен снаружи
    volumes:
      - ./nginx/r23-site.conf:/opt/bitnami/nginx/conf/server_blocks/site.conf:ro
      - r23-storage:/app:ro
    depends_on:
      r23-php-fpm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s # Аналог preStop sleep 10s
    restart: unless-stopped

  r23-php-fpm:
    image: hanna.center-inform.ru/php-fpm/php-fpm:5.3.29
#    user: "1001:1001"
    volumes:
      - r23-storage:/app
    environment:
      - PHP_MEMORY_LIMIT=512M
      - PHP_DISPLAY_ERRORS=Off
      - PHP_ERROR_REPORTING=E_ALL & ~E_NOTICE & ~E_WARNING & ~E_DEPRECATED
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(file_exists('/app/index.php') ? 0 : 1);\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
    restart: unless-stopped

