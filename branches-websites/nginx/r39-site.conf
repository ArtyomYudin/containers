# Upstream для PHP-FPM.
# ВАЖНО: 'php-fpm' должно в точности совпадать с именем сервиса в docker-compose.yml
upstream php_backend {
    server r39-php-fpm:9000;
    keepalive 32; # Оптимизация соединений с PHP-FPM
}

server {
    listen 8080 default_server;
    server_name _;

    root /app;
    index index.php;

    client_max_body_size 64M;
    charset utf-8;

    # Clean URLs (ЧПУ)
    location / {
        try_files $uri $uri/ @rewrite;
    }

    # Фоллбэк для всех несуществующих файлов
    location @rewrite {
        # Перенаправляем запрос в index.php, помещая URI в параметр q
        rewrite ^/(.*)$ /index.php?q=$1 last;
    }

    # Прямые запросы к .php файлам
    location ~ \.php$ {
        # Проверяем, что файл реально существует, иначе отдаем 404 (защита от перебора)
        try_files $uri =404;

        fastcgi_pass php_backend;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Для ALB / Reverse Proxy
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;

        fastcgi_param HTTP_HOST $host;

        # Сообщаем PHP/MODX что пользователь пришел по HTTPS
        fastcgi_param HTTPS $http_x_forwarded_proto;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Скрытые файлы (.htaccess, .git и т.д.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Кеширование статики
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|eot|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}